# nmt-transformer — base configuration
# WMT14 English-German

data:
  raw_dir: data/raw
  processed_dir: data/processed
  src_lang: en
  tgt_lang: de

  # All entries verified: URLs fetched, byte counts measured with `ls -l`,
  # and archive member paths confirmed with `tar -tzf`.

  corpora:
    - name: news_commentary
      url: https://statmt.org/wmt14/training-parallel-nc-v9.tgz
      archive: training-parallel-nc-v9.tgz
      expected_bytes: 80418416
      src_path: training/news-commentary-v9.de-en.en
      tgt_path: training/news-commentary-v9.de-en.de
      split: train
      pairs: 201288              # measured, not estimated

    - name: europarl
      # Hosted under wmt13 — the corpus was unchanged for WMT14.
      url: https://statmt.org/wmt13/training-parallel-europarl-v7.tgz
      archive: training-parallel-europarl-v7.tgz
      expected_bytes: 657632379
      src_path: training/europarl-v7.de-en.en
      tgt_path: training/europarl-v7.de-en.de
      split: train
      pairs: 1920209

    - name: commoncrawl
      # Largest and noisiest. Verified failure modes: block-level misalignment
      # (from line 8 onward the "German" side is English), isolated bad pairs,
      # and topically-related-but-not-parallel text that no cheap filter
      # catches. Members sit at the archive root, NOT under training/.
      # A third member, commoncrawl.de-en.annotation, records pair provenance —
      # match on the explicit paths below rather than globbing *de-en*.
      url: https://statmt.org/wmt13/training-parallel-commoncrawl.tgz
      archive: training-parallel-commoncrawl.tgz
      expected_bytes: 918311367
      src_path: commoncrawl.de-en.en
      tgt_path: commoncrawl.de-en.de
      split: train
      pairs: 2399123

    # ---- dev / test ----
    # dev.tgz ships newstest2013 in both raw text and SGML; plain text is used
    # here since it needs no unwrapping. newstest2014 is SGML only and needs
    # unwrapping before evaluation.

    - name: newstest2013
      url: https://statmt.org/wmt14/dev.tgz
      archive: dev.tgz
      expected_bytes: 17742707
      src_path: dev/newstest2013.en
      tgt_path: dev/newstest2013.de
      split: dev
      format: text
      pairs: 3000

    - name: newstest2014
      # Full set, not test-filtered.tgz. Published BLEU numbers — including
      # the paper's 27.3 — are computed on all 3003 segments. The filtered
      # set has 2737 (verified with grep -c '<seg') and would give an
      # incomparable score.
      url: https://statmt.org/wmt14/test-full.tgz
      archive: test-full.tgz
      expected_bytes: 3255445
      src_path: test-full/newstest2014-deen-src.en.sgm
      tgt_path: test-full/newstest2014-deen-ref.de.sgm
      split: test
      format: sgml
      pairs: 3003

download:
  chunk_size: 1048576        # 1 MiB streaming writes
  partial_suffix: .partial   # rename on success so interrupted runs never look complete
  timeout_seconds: 300

# ---- Day 2 ----
# Thresholds measured from the corpora, not taken from convention. Whitespace
# token counts at the 99.9th percentile:
#   length (en/de)  news_commentary 76/78, europarl 107/100, commoncrawl 103/94
#   ratio           news_commentary 2.9,   europarl 4.0,     commoncrawl 8.2
# Maximum observed length: 171 / 668 / 4225 — commoncrawl's tail is scraped
# pages dumped onto a single line.
cleaning:
  min_len: 1
  max_len: 100             # just above europarl's 99.9th; cuts commoncrawl's tail
  max_len_ratio: 2.5       # 15 commoncrawl pairs above this were inspected;
                           # none were worth keeping
  max_token_chars: 40      # catches lines with all spaces stripped, e.g.
                           # "WelcheLektionenlassensichnunausdiesem..." — these
                           # otherwise pass as a handful of legitimate tokens
  dedupe: true             # exact, on the (src, tgt) pair jointly — never per
                           # side, and no fuzzy/MinHash (see docs/progress.md)
  drop_empty: true
  normalize_unicode: true  # curly quotes (U+2019, U+201C-E), en dash (U+2013),
                           # soft hyphen (U+00AD), stray CR (3938 in nc German)
  language_id: true        # all three corpora, not just commoncrawl:
                           # news_commentary contains Chinese source lines
  language_id_min_tokens: 5

# ---- filled in on Day 4 ----
tokenizer:
  type: bpe
  shared_vocab: true
  # Paper section 5.1 reports a shared source-target vocabulary of ~37000
  # tokens. This is the FINAL vocab size, not a merge count: the merge count
  # is vocab_size minus the base alphabet minus the special tokens, and gets
  # derived on Day 4 once the alphabet is known.
  vocab_size: 37000
  special_tokens:
    pad: 0
    unk: 1
    bos: 2
    eos: 3

# ---- Day 6 onward. Paper base model, section 5.1 ----
model:
  d_model: 512
  num_heads: 8
  d_ff: 2048
  num_layers: 6
  dropout: 0.1
  max_len: 512               # must exceed cleaning.max_len plus bos/eos

training:
  max_pairs: null            # subsample size — set after measuring throughput
  batch_tokens: 4096         # batch by token count, not sentence count
  label_smoothing: 0.1
  warmup_steps: 4000
  grad_clip: 1.0
  adam_betas: [0.9, 0.98]
  adam_eps: 1.0e-9
  checkpoint_dir: checkpoints
  seed: 42

inference:
  beam_size: 4
  length_penalty: 0.6
  max_decode_len: 256